service: codearena-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.11
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-south-1'}
  memorySize: 2048
  timeout: 30
  environment:
    DATABASE_URL: 
    JWT_SECRET: 
    PISTON_ENDPOINTS: 
    PISTON_API_KEY: ""
    CORS_ORIGINS: https://zap-arena.vercel.app,http://localhost:5173
    ADMIN_EMAIL: 
    ADMIN_PASSWORD: 
    ENABLE_STARTUP_MIGRATION: "false"

functions:
  api:
    handler: api.handler.handler
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true

package:
  patterns:
    - 'api/**'
    - '!node_modules/**'
    - '!.venv/**'
    - '!**/__pycache__/**'
    - '!.git/**'